name: Probe PvP sites (temporary)
on:
  push:
    branches: [probe-pvp]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe 3
        run: |
          UA="techrul.github.io probe (one-off; contact via github.com/Techrul)"
          ID=b1ceb3ea-cc5c-4c9d-b129-c24439a9d9c1
          for u in /api/v1/players/by-name/Techrul /api/v1/players/$ID "/api/v1/players/$ID/matches?page=0&size=3" "/api/v1/players/$ID/rating-history/sword?limit=5" "/api/v1/players/$ID/rivals?limit=3" "/api/v1/players/$ID/breakdown/sword?limit=3"; do
            echo "=== $u"; curl -sSL -m 20 -A "$UA" -H 'Origin: https://techrul.github.io' -D h.txt "https://pvphq.com$u" | head -c 3500; echo; grep -i 'access-control-allow-origin\|x-ratelimit' h.txt; done
