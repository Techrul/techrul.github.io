name: Probe PvP sites (temporary)
on:
  push:
    branches: [probe-pvp]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Save samples
        run: |
          UA="techrul.github.io (personal stats page; github.com/Techrul)"
          ID=b1ceb3ea-cc5c-4c9d-b129-c24439a9d9c1
          mkdir s && cd s
          curl -sSL -m 20 -A "$UA" "https://www.mcpvp.com/@Techrul" -o mcpvp.html
          curl -sSL -m 20 -A "$UA" "https://pvphq.com/api/v1/players/by-name/Techrul" -o player.json
          curl -sSL -m 20 -A "$UA" "https://pvphq.com/api/v1/players/$ID/matches?page=0&size=50" -o matches.json
          for g in sword axe uhc; do curl -sSL -m 20 -A "$UA" "https://pvphq.com/api/v1/players/$ID/rating-history/$g?limit=200" -o hist_$g.json; done
          curl -sSL -m 20 -A "$UA" "https://pvphq.com/api/v1/players/$ID/rivals?limit=10" -o rivals.json
          curl -sSL -m 20 -A "$UA" "https://pvphq.com/api/v1/players/$ID/breakdown/sword?limit=50" -o breakdown_sword.json
          ls -la
          tar cz . | base64 -w 0 > ../b64.txt; echo; echo "B64START"; cat ../b64.txt; echo; echo "B64END"
