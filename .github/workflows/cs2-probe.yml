name: CS2 probe

# Runs scripts/cs2_probe.py (4 Liquipedia requests, hard cap 6) whenever the probe or this file changes on the
# cs2 branch, and commits the printed results to the branch as CS2_PROBE_RESULT.txt. Never touches main or the
# live site. (A manual "Run workflow" button would need this file on main, so it is triggered by pushes instead.)
on:
  push:
    branches: [cs2]
    paths:
      - scripts/cs2_probe.py
      - .github/workflows/cs2-probe.yml

concurrency:
  group: cs2-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # only to commit CS2_PROBE_RESULT.txt to the cs2 branch
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Ask Liquipedia
        env:
          LIQUIPEDIA_API_KEY: ${{ secrets.LIQUIPEDIA_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          {
            echo "CS2 probe, $(date -u '+%Y-%m-%d %H:%M UTC'), commit ${GITHUB_SHA::7}"
            echo
            if [ -z "$LIQUIPEDIA_API_KEY" ]; then
              echo "LIQUIPEDIA_API_KEY secret is empty or missing (check its exact name in Settings > Secrets)."
            else
              python scripts/cs2_probe.py 2>&1 && echo "exit: ok" || echo "exit: failed ($?)"
            fi
          } > CS2_PROBE_RESULT.txt
          cat CS2_PROBE_RESULT.txt
          { echo '```'; cat CS2_PROBE_RESULT.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the result to the cs2 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CS2_PROBE_RESULT.txt
          git commit -m "CS2 probe result" || exit 0
          git push
