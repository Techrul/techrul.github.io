name: Update rankings

on:
  schedule:
    - cron: "15 */3 * * *"   # every 3 hours (00:15, 03:15, ... UTC), so results show up the same day
  workflow_dispatch:         # "Run workflow" button in the Actions tab
    paths-ignore:            # text-only changes don't affect the site
      - "**.md"
      - LICENSE

concurrency:
  group: pages
  cancel-in-progress: false

env:
  VALVE_COMMIT: eec4853d7bcf0f1f7efe7f0d901234bef7e98b75   # review Valve's changes before moving this

# Action versions run on Node 24 (GitHub removed Node 20 from its runners on 23 Sep 2026).
# Optional steps (prize money, VRS, trophy photos) are allowed to fail: the site still updates
# without them. Only the match data, ratings, pages and deploy must succeed.
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe old CS:GO data
        env:
          LIQUIPEDIA_API_KEY: ${{ secrets.LIQUIPEDIA_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python -u scripts/probe_old.py
