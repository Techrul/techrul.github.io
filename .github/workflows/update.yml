name: Update rankings

on:
  schedule:
    - cron: "15 6 * * *"   # daily, 06:15 UTC
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:                      # any change pushed to main goes live within minutes
    branches: [main]
    paths-ignore:            # text-only changes don't affect the site
      - "**.md"
      - LICENSE

concurrency:
  group: pages
  cancel-in-progress: false

env:
  VALVE_COMMIT: eec4853d7bcf0f1f7efe7f0d901234bef7e98b75   # review Valve's changes before moving this

# Action versions run on Node 24 (GitHub removed Node 20 from its runners on 23 Sep 2026).
# Optional steps (prize money, VRS, trophy photos) are allowed to fail: the site still updates
# without them. Only the match data, ratings, pages and deploy must succeed.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write        # only for the keepalive commit below
    steps:
      - uses: actions/checkout@v5

      # GitHub pauses scheduled workflows in public repos after 60 days without repository activity.
      # If the repo has been quiet for 45 days, commit a one-line date file so the daily update keeps running.
      - name: Keep the daily schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            date -u +%Y-%m-%d > .github/keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive
            git commit -m "Keep scheduled updates running"
            git push
          else
            echo "Last commit $(( ($(date +%s) - last) / 86400 )) days ago; nothing to do"
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - run: pip install -r requirements.txt

      # Raw match files and the prize money cache are kept privately between runs, never committed or
      # uploaded. data/prize_money.json in the repo is the starting copy; a cached newer one replaces it.
      - uses: actions/cache@v5
        with:
          path: |
            data/raw
            data/rankings
            data/prize_money.json
            data/trophy_images
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Fetch match data
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python scripts/fetch_tml.py --start-year 2015 --raw data/raw

      - name: Look up prize money for new events (Wikipedia)
        continue-on-error: true
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python scripts/prize_money.py --raw data/raw

      - name: Get Valve's VRS code and published standings (pinned commit, model and live folders)
        continue-on-error: true
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/ValveSoftware/counter-strike_regional_standings vendor/vrs
          git -C vendor/vrs sparse-checkout set model live
          git -C vendor/vrs checkout "$VALVE_COMMIT"

      # The old file is removed first, so if this step fails the site shows no VRS rather than stale VRS.
      - name: Run VRS on tennis
        continue-on-error: true
        run: |
          rm -f docs/rankings/tennis/data/vrs.json
          python scripts/vrs_tennis.py --raw data/raw --prize data/prize_money.json --valve vendor/vrs --out docs/rankings/tennis/data/vrs.json

      - name: Compute ratings
        run: python scripts/ratings.py --raw data/raw --rankings data/rankings --vrs docs/rankings/tennis/data/vrs.json --out docs/rankings/tennis/data/rankings.json --start-year 2015

      - name: Build history, profiles, records and tournaments
        run: python scripts/site_data.py --raw data/raw --rankings data/rankings --prize data/prize_money.json --valve vendor/vrs --current docs/rankings/tennis/data/rankings.json --out docs/rankings/tennis/data --start-year 2015

      # Photos listed in data/trophies.json (Wikimedia Commons), downloaded once and credited.
      - name: Trophy photos
        continue-on-error: true
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python scripts/trophies.py --out docs/rankings/tennis

      # ---------------------------------------------------------------- CS2 (all optional: CS2 trouble never stops tennis)
      # Liquipedia's API: recent weeks every day, plus any month not fetched yet; at most 30 requests (their limit is
      # 60 an hour). Stops early, keeping what it has, if Liquipedia rate-limits it. The data is committed below.
      - name: Fetch CS2 data (Liquipedia)
        continue-on-error: true
        env:
          LIQUIPEDIA_API_KEY: ${{ secrets.LIQUIPEDIA_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        # 5-minute limit: a normal day takes under a minute. If Liquipedia answers 429 (rate limited), the fetcher would
        # wait 15 minutes before retrying; with this limit it stops at once instead, and tomorrow's run catches up.
        # The output is kept in data/cs2/last_fetch.log (committed below) so a failed day can be diagnosed.
        run: |
          set -o pipefail
          python -u scripts/fetch_cs2.py --start 2023-01 --max-requests 30 --per-hour 45 --max-minutes 5 2>&1 | tee data/cs2/last_fetch.log

      - name: CS2 ratings
        id: cs2
        continue-on-error: true
        run: python scripts/cs2_ratings.py --data data/cs2 --valve vendor/vrs --out docs/rankings/cs2/data/rankings.json

      - name: CS2 history, team pages, records and events
        if: steps.cs2.outcome == 'success'
        continue-on-error: true
        run: python scripts/cs2_site_data.py --data data/cs2 --valve vendor/vrs --current docs/rankings/cs2/data/rankings.json --out docs/rankings/cs2/data

      # Liquipedia's data is CC BY-SA: keeping it in the repo (not only in the Actions cache, which is dropped after
      # 7 days unused) means a lost cache never means fetching everything again.
      - name: Save CS2 data
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cs2
          git diff --cached --quiet && { echo "no new CS2 data"; exit 0; }
          git commit -m "CS2 data from Liquipedia"
          # --autostash: the cache step above replaces data/prize_money.json, which would otherwise block the pull
          git pull --rebase --autostash -q origin main && git push

      - name: Copy pages
        run: python scripts/build_site.py --site site --out docs

      # Only the generated site goes to Pages.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  # Only main is ever published. Work in progress (e.g. the cs2 branch) can run the build to check it,
  # but never replaces the live site.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
